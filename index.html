<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra cứu & Xác minh tài khoản TikTok</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
      min-height: 100vh;
    }
    .card {
      background: #1e1e1e;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid #2c2c2c;
      height: fit-content;
    }
    h3 { margin: 0 0 16px; font-size: 19px; text-align: center; }
    .search-row { display: flex; gap: 8px; }
    input {
      flex: 1;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid #383838;
      background: #2a2a2a;
      color: #fff;
      outline: none;
      font-size: 14px;
    }
    input:focus { border-color: #25f4ee; }
    button {
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-search { background: #fe2c55; color: #fff; }
    .status-bar {
      margin-top: 10px;
      font-size: 12px;
      color: #9e9e9e;
      min-height: 16px;
      text-align: center;
    }
    .error-box {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(254, 44, 85, 0.14);
      border: 1px solid rgba(254, 44, 85, 0.4);
      color: #ff8099;
      font-size: 13px;
    }
    .profile {
      display: none;
      margin-top: 20px;
      text-align: center;
      border-top: 1px solid #2f2f2f;
      padding-top: 20px;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #25f4ee;
      background: #2a2a2a;
    }
    .source-tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #2b2b2b;
      color: #25f4ee;
    }
    .name-row {
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge {
      display: none;
      background: #20d5ec;
      color: #000;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: bold;
    }
    .username { color: #aaa; margin-top: 4px; font-size: 13px; }
    .bio {
      font-size: 13px;
      color: #ddd;
      margin: 12px 0 16px;
      word-break: break-word;
      line-height: 1.45;
    }
    .btn-grant {
      margin-top: 8px;
      width: 100%;
      background: #20d5ec;
      color: #000;
      padding: 12px;
    }
    .grant-result {
      margin-top: 10px;
      font-size: 13px;
      color: #25f4ee;
      min-height: 18px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="card">
  <h3>Xác minh hồ sơ TikTok</h3>

  <div class="search-row">
    <input id="usernameInput" type="text" placeholder="Nhập @username (vd: @tiktok)" autocomplete="off">
    <button id="searchBtn" class="btn-search" onclick="findUser()">Tìm</button>
  </div>

  <div id="statusBar" class="status-bar"></div>
  <div id="errorBox" class="error-box"></div>

  <div id="profile" class="profile">
    <img id="avatar" class="avatar" src="" alt="Avatar">
    <div><span id="sourceTag" class="source-tag">TikTok oEmbed API</span></div>

    <div class="name-row">
      <span id="nickname"></span>
      <span id="badge" class="badge">✔ Tích xanh</span>
    </div>

    <div id="uniqueId" class="username"></div>
    <div id="signature" class="bio"></div>

    <button id="grantBtn" class="btn-grant" onclick="grantBlueBadge()">Phát tích xanh trực tiếp</button>
    <div id="grantResult" class="grant-result"></div>
  </div>
</div>

<script>
  const CLOUDFLARE_WORKER_URL = "https://tiktok-user-proxy.tvietanh0601.workers.dev";

  const inputEl = document.getElementById("usernameInput");
  const searchBtn = document.getElementById("searchBtn");
  const statusBar = document.getElementById("statusBar");
  const errorBox = document.getElementById("errorBox");
  const profileEl = document.getElementById("profile");
  const grantResultEl = document.getElementById("grantResult");

  let currentUserData = null;

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      findUser();
    }
  });

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = "block";
  }

  function clearError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
  }

  function makeSvgAvatar(text) {
    const label = encodeURIComponent((text || "TT").slice(0, 2).toUpperCase());
    return `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='100%25' height='100%25' fill='%23282828'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='%2325f4ee' font-family='Arial' font-size='42' font-weight='bold'>${label}</text></svg>`;
  }

  async function findUser() {
    clearError();
    grantResultEl.textContent = "";

    const cleanUser = inputEl.value.trim().replace(/^@/, "");
    if (!cleanUser) {
      showError("Vui lòng nhập @username trước khi tìm.");
      return;
    }

    searchBtn.disabled = true;
    statusBar.textContent = `Đang tra cứu @${cleanUser}...`;

    try {
      const workerBase = CLOUDFLARE_WORKER_URL.trim().replace(/\/+$/, "");
      // Gọi qua Worker trước; nếu Worker chưa cấu hình thì gọi thẳng oEmbed của TikTok
      const endpoint = workerBase
        ? `${workerBase}/?unique_id=${encodeURIComponent(cleanUser)}`
        : `https://www.tiktok.com/oembed?url=${encodeURIComponent(`https://www.tiktok.com/@${cleanUser}`)}`;

      const res = await fetch(endpoint);
      const data = await res.json();

      let user = null;
      if (data && data.code === 0 && data.data && data.data.user) {
        user = data.data.user;
      } else if (data && data.author_name) {
        user = {
          id: data.author_id || "oEmbed",
          uniqueId: cleanUser,
          nickname: data.author_name,
          signature: data.title ? `Bài đăng gần nhất: ${data.title}` : "",
          verified: false
        };
      }

      if (!user) {
        showError((data && data.msg) || "Không tìm thấy tài khoản trên TikTok.");
        return;
      }

      currentUserData = user;
      document.getElementById("avatar").src = makeSvgAvatar(user.nickname || user.uniqueId);
      document.getElementById("nickname").textContent = user.nickname;
      document.getElementById("uniqueId").textContent = `@${user.uniqueId} • ID: ${user.id}`;
      document.getElementById("signature").textContent = user.signature;
      document.getElementById("badge").style.display = user.verified ? "inline-block" : "none";
      grantResultEl.textContent = "Đã xác minh tên kênh thật qua TikTok oEmbed.";
      profileEl.style.display = "block";
    } catch (err) {
      showError("Lỗi gọi oEmbed: " + (err && err.message ? err.message : "Không xác định"));
    } finally {
      searchBtn.disabled = false;
      statusBar.textContent = "";
    }
  }

  function grantBlueBadge() {
    if (!currentUserData) return;
    document.getElementById("badge").style.display = "inline-block";
    currentUserData.verified = true;
    const now = new Date().toLocaleTimeString("vi-VN");
    grantResultEl.textContent = `✔ Đã bật tích xanh cho @${currentUserData.uniqueId} lúc ${now} (chờ nối endpoint POST nội bộ để ghi vào DB thật).`;
  }
</script>

</body>
</html>
